<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>We have moved</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="https://crumbsandchaos.co/">
  <meta http-equiv="refresh" content="6;url=https://crumbsandchaos.co/">
  <style>
    :root { --paper: #fffae7; --ink: #765844; --rose: #a26661; --sage: #748661; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      display: grid;
      place-items: center;
      background: var(--paper);
      color: var(--ink);
      font-family: Georgia, "Iowan Old Style", Palatino, "Palatino Linotype", serif;
    }
    main { width: min(36rem, calc(100% - 2rem)); padding: 2.5rem 0; text-align: center; }
    h1 { margin: 0; font-size: clamp(2.4rem, 7vw, 3.6rem); font-weight: 500; letter-spacing: -0.02em; }
    .bar { height: 6px; width: 7rem; margin: 1.1rem auto 1.3rem; background: var(--sage); }
    p { margin: 0.4rem 0; font-size: 1.25rem; line-height: 1.45; }
    a { color: var(--rose); }
    .quiet { margin-top: 1.4rem; font-size: 1rem; }
  </style>
</head>
<body>
  <main>
    <h1>We have moved</h1>
    <div class="bar"></div>
    <p>The Last Stop is now Crumbs &amp; Chaos.</p>
    <p><a href="https://crumbsandchaos.co/">Continue to crumbsandchaos.co</a></p>
    <p class="quiet">This page continues on its own in a few seconds.</p>
  </main>
  <script>
    setTimeout(function () {
      window.location.replace("https://crumbsandchaos.co/");
    }, 6000);
  </script>
</body>
</html>
